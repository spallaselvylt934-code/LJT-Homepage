<div class="list__item">
  <article class="archive__item">
    <h2 class="archive__item-title">{{ include.pub.title }}</h2>
    <p>{{ include.pub.authors }}</p>
    <p><em>{{ include.pub.venue }}</em>, {{ include.pub.year }}</p>
    {% if include.pub.repository %}<p>{{ include.pub.repository }}</p>{% endif %}
  </article>
</div>
